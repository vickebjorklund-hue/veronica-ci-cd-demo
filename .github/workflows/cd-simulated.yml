name: Simulated CD

on:
  push:
    branches:
      - main
      - "demo/**"

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t devops25-cicd-demo:cd .

      - name: Start application
        run: |
          docker run -d \
            --name devops25-app \
            -p 8000:8000 \
            devops25-cicd-demo:cd

      - name: Verify deployment
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Deployment verified!"
              exit 0
            fi
            sleep 2
          done

          docker logs devops25-app
          exit 1
       
      - name: Verify deployed version
        run: |
          set -o pipefail
          echo "Checking deployed application version..."
          curl --fail --silent --show-error http://localhost:8000/version
          echo
          curl --fail --silent --show-error http://localhost:8000/version | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["version"] == "1.1"'
          echo "Correct application version deployed"
      
      - name: Stop application
        if: always()
        run: |
          docker rm -f devops25-app || true