name: CI Pipeline

on:
  push:
    branches:
      - main
      - "demo/**"

  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Test, Lint and Docker
    runs-on: ubuntu-latest

    steps:
      # STEG 1: Hämta koden
      - name: Checkout repository
        uses: actions/checkout@v6

      # STEG 2: Installera Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # STEG 3: Installera beroenden
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run tests and create report
        run: pytest --junitxml=test-results.xml
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error

      # STEG 5: Kontrollera kodkvalitet
      - name: Run Ruff
        run: ruff check app tests

      # STEG 6: Bygg Dockerimage
      - name: Build Docker image
        run: docker build -t devops25-cicd-demo:ci .

      # STEG 7: Starta Dockercontainer
      - name: Start Docker container
        run: |
          docker run -d \
            --name devops-demo \
            -p 8000:8000 \
            devops25-cicd-demo:ci

      # STEG 8: Verifiera applikationen
      - name: Verify application
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Application is running!"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          docker logs devops-demo
          exit 1

      # STEG 9: Stoppa och ta bort containern
      - name: Stop container
        if: always()
        run: docker rm -f devops-demo || true